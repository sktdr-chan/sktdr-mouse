name: Build Windows distribution

# - push to main      → build + update the rolling "latest" release
# - push a tag (v*)   → build + create/update that versioned release
# - manual run        → same as a main push
#
# Requires a Forgejo runner registered with the label `linux` in host mode
# (Node.js 22 installed on the runner host). The automatic Forgejo Actions
# token is used to create releases, so no personal token is needed in CI.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: linux
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: node --version && npm --version && git --version && curl --version | head -n 1

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${{ github.ref_name }}" != "$expected" ]; then
            echo "tag ${{ github.ref_name }} does not match package.json version ($expected)"
            exit 1
          fi

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build folder distribution
        run: npm run dist

      # Keep the rolling release's tag on the commit it was built from, so the
      # "source code" link on the release page matches the attached ZIP.
      - name: Move "latest" tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ github.ref }}" in
            refs/tags/*) node scripts/publish-release.js --tag "${{ github.ref_name }}" ;;
            *)           node scripts/publish-release.js --tag latest ;;
          esac
