name: Publish to GitHub

on:
  workflow_run:
    workflows: ["Build Windows distribution"]   # release.yml の name と完全一致
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: false
        type: string

jobs:
  publish:
    # release.yml が成功したとき、または手動実行時のみ
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: linux
    steps:
      - name: Set tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            # workflow_run の場合、元のrefからタグ名を取得
            if [[ "${{ github.event.workflow_run.head_branch }}" == v* ]]; then
              echo "name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
            else
              # ブランチpushの場合は latest など
              echo "name=latest" >> $GITHUB_OUTPUT
            fi
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.name }}

      - name: Push source and tag to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_SKMOUSE_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@forgejo.local"
          git remote add github https://x-access-token:${GH_TOKEN}@github.com/sktdr-chan/sktdr-mouse.git
          git push github HEAD:refs/heads/main --force
          git push github "$TAG" --force

      - name: Download release assets from Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FG_SKMOUSE_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir -p assets
          echo "Waiting for Forgejo release ${TAG}..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              "https://forgejo.pw2.org/api/v1/repos/sktdr/sktdr-mouse/releases/tags/${TAG}")
            if [ "$STATUS" = "200" ]; then
              echo "Release found."
              break
            fi
            echo "Not ready yet (${STATUS}), waiting 5s... ($i/20)"
            sleep 5
          done

          curl -s -H "Authorization: token ${FORGEJO_TOKEN}" \
            "https://forgejo.pw2.org/api/v1/repos/sktdr/sktdr-mouse/releases/tags/${TAG}" \
            | jq -r '.assets[].browser_download_url' \
            | while read url; do
                filename=$(basename "$url")
                curl -L -H "Authorization: token ${FORGEJO_TOKEN}" -o "assets/${filename}" "$url"
              done
          ls -la assets/

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GH_SKMOUSE_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if ! command -v gh &> /dev/null; then
            curl -sL https://github.com/cli/cli/releases/download/v2.62.0/gh_2.62.0_linux_amd64.tar.gz | tar xz
            mv gh_2.62.0_linux_amd64/bin/gh /usr/local/bin/ || sudo mv gh_2.62.0_linux_amd64/bin/gh /usr/local/bin/
          fi

          gh release delete "$TAG" --repo sktdr-chan/sktdr-mouse --yes || true

          gh release create "$TAG" \
            --repo sktdr-chan/sktdr-mouse \
            --title "$TAG" \
            --notes "Release from Forgejo" \
            assets/*