<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sktdr-mouse</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span id="brandName">sktdr</span><em id="brandModel">-mouse</em><span class="sub" id="brandSub">設定ツール</span><span class="build-badge" id="buildBadge" hidden></span><span class="mode-badge" id="modeBadge" hidden>WebHID</span></div>
  <div class="chips">
    <span id="deviceChips" class="device-chips"></span>
    <span id="connChip" class="chip chip-off">未接続</span>
    <span id="batteryChip" class="chip chip-off" title="バッテリー">🔋 --%</span>
    <button id="connectHidBtn" class="chip chip-btn chip-connect" hidden title="WebHIDでマウスを接続">🔌 <span id="connectHidLabel">マウスを接続</span></button>
    <button id="manageBtn" class="chip chip-btn" title="対応するマウスの一覧と管理">⚙ <span id="manageBtnLabel">管理</span></button>
    <label class="chip chip-btn mode-chip" id="modeChip" title="変更の適用方法：即時適用か、保存ボタンでまとめて適用か">
      <input type="checkbox" id="applyModeToggle" checked>
      <span id="applyModeLabel">即時適用</span>
    </label>
    <button id="applyAllBtn" class="btn small hidden" title="保留中の変更をデバイスに適用">適用</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main id="app">

  <div id="side">
    <section class="card">
      <h2 id="deviceInfoTitle">デバイス情報</h2>
      <div class="kv-grid" id="deviceKv"></div>
      <div class="row" id="deviceActions"></div>
      <p class="hint" id="protocolSource"></p>
    </section>

    <!-- ログ: デバイス情報の直下に置き、スクロール中も左レールに追従させる -->
    <section class="card log-card" id="logCard">
      <h2 id="logTitle">ログ</h2>
      <ul id="logList" class="log"></ul>
    </section>
  </div>

  <div id="sections"></div>

</main>

<!-- 対応するマウスの一覧・管理 -->
<dialog id="manageDialog">
  <header class="manage-header">
    <h3 id="manageTitle">対応するマウス</h3>
    <button id="manageClose" class="btn small" title="閉じる">✕</button>
  </header>
  <p class="hint" id="manageHint">
    接続中のマウスが上部に表示されます。非アクティブ（切断・スリープ）になったマウスは灰色になり、
    1分間再接続されないと自動で消えます。
  </p>
  <p class="hint disclaimer-note" id="disclaimerNote">
    本ソフトは非公式・無保証です。すべて自己責任で使用してください。
  </p>
  <div class="manage-settings">
    <label for="langSelect" id="langLabel">表示言語</label>
    <select id="langSelect"></select>
  </div>
  <div class="manage-settings">
    <span id="buildInfoLabel">ビルド</span>
    <span id="buildInfoValue" class="build-value">—</span>
  </div>
  <div class="manage-settings" id="modeInfoRow">
    <span id="modeInfoLabel">接続モード</span>
    <span id="modeInfoValue" class="build-value">—</span>
  </div>
  <div class="manage-webhid-bar hidden" id="manageWebHidBar">
    <button id="manageConnectBtn" class="btn small">🔌 <span id="manageConnectLabel">マウスを接続</span></button>
    <button id="manageReconnectBtn" class="btn small">↻ <span id="manageReconnectLabel">権限済みデバイスを再スキャン</span></button>
  </div>
  <div id="manageList"></div>
</dialog>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
