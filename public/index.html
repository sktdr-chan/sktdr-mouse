<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マウス設定ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span id="brandName">Mouse</span> <em id="brandModel">Config</em><span class="sub">設定ツール</span></div>
  <div class="chips">
    <span id="deviceChips" class="device-chips"></span>
    <span id="connChip" class="chip chip-off">未接続</span>
    <span id="batteryChip" class="chip chip-off" title="バッテリー">🔋 --%</span>
    <label class="chip mode-chip" title="変更の適用方法：即時適用か、保存ボタンでまとめて適用か">
      <input type="checkbox" id="applyModeToggle" checked>
      <span id="applyModeLabel">即時適用</span>
    </label>
    <button id="applyAllBtn" class="btn small hidden" title="保留中の変更をデバイスに適用">適用</button>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main id="app">

  <section class="card">
    <h2>デバイス情報</h2>
    <div class="kv-grid" id="deviceKv"></div>
    <div class="row" id="deviceActions"></div>
    <p class="hint" id="protocolSource"></p>
  </section>

  <div id="sections"></div>

  <section class="card">
    <h2>ログ</h2>
    <ul id="logList" class="log"></ul>
  </section>

</main>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
